R1_TOOL_NOT_ALLOWED:
  title: "This tool does not fit the task"
  plain: "The tool was not allowed for the job that was selected."
  why: "It stops the AI from doing a different job than the person asked for."
  example: "A resume summary task tried to send an email."
  what_to_do: "Choose the right task or use a tool that belongs to it."
R2_RECIPIENT_NOT_ALLOWED:
  title: "Email to a company we don't work with"
  plain: "The email was going to an address outside the approved company list."
  why: "Stops a fooled AI from sending student data to an attacker's inbox."
  example: "hr-verify@evil.co instead of hr@partner-company.com"
  what_to_do: "Use an approved company address, or ask the lead to add the company to the approved list."
R3_FILE_OUT_OF_SCOPE:
  title: "File is outside this task"
  plain: "The task was not allowed to open or attach this file."
  why: "Keeps each task limited to the files it needs."
  example: "A resume task tried to open sandbox/payroll.csv."
  what_to_do: "Use a file that is in the task's allowed folder."
R4_SENSITIVE_FILE:
  title: "This file must stay private"
  plain: "This file is marked as too sensitive to attach or delete."
  why: "Protects private lists and records from being sent or removed."
  example: "An email tried to attach the placement list."
  what_to_do: "Remove the file from the action and ask the lead if the task needs it."
R5_SENSITIVE_DATA_OUT:
  title: "Private details were in the email"
  plain: "The email text included private details such as a phone number or a list of email addresses."
  why: "Stops private information from leaving in an email."
  example: "The message body included a student's phone number."
  what_to_do: "Remove the private details and check the message again."
R6_MALFORMED_CALL:
  title: "The tool request was not complete"
  plain: "The request was missing information or included something the tool does not accept."
  why: "A broken or unclear request should never be allowed to run."
  example: "A file request had no file name."
  what_to_do: "Fix the request so it has the required fields and text values."
R7_TOO_MANY_CALLS:
  title: "Too many actions in one task"
  plain: "The AI tried to do more actions than this task allows."
  why: "Limits how much can happen before someone checks the result."
  example: "The task tried four actions when the limit was three."
  what_to_do: "Run fewer actions or ask the lead to review the task."
R8_GLOBAL_DENY:
  title: "This tool is never allowed"
  plain: "This tool is blocked for every task."
  why: "Some actions are too risky to run in this demo."
  example: "A request tried to delete a file."
  what_to_do: "Choose a safe action that does not delete anything."
R9_TAINTED_EGRESS:
  title: "Earlier file data could leave"
  plain: "A file read earlier in this task could be included in an email."
  why: "Stops information from a private file being sent out later."
  example: "The task read a private list, then tried to email its contents."
  what_to_do: "Do not send an email based on that file; ask the lead to check the task."
R10_ENCODED_EXFIL:
  title: "Private data may be hidden"
  plain: "The email may hide private information using a code or split it across messages."
  why: "Checks for private data even when it is disguised."
  example: "A phone number was changed into a coded string before sending."
  what_to_do: "Remove the coded text and ask someone to check the message."
R11_APPROVAL_TAMPERED:
  title: "The approval no longer matches"
  plain: "The action changed after it was sent for human review."
  why: "Makes sure only the exact action a person saw can be approved."
  example: "The email address changed after the reviewer approved it."
  what_to_do: "Do not approve it; send the updated action for a new review."
HUMAN_APPROVED:
  title: "A person approved the action"
  plain: "A signed-in person checked the request and allowed it."
  why: "Some actions need a person to make the final choice."
  example: "A reviewer approved an email after checking its recipient."
  what_to_do: "Open the linked log entry to see what was approved."
HUMAN_DENIED:
  title: "A person stopped the action"
  plain: "A signed-in person checked the request and said no."
  why: "A person can stop an action that does not look safe."
  example: "A reviewer denied an email to an unapproved address."
  what_to_do: "Change the request and send it for review again if needed."
REVIEW_TIMEOUT:
  title: "The review time ran out"
  plain: "No one made a choice before the review deadline."
  why: "A request must not run just because nobody answered."
  example: "The review stayed open until its timer ended."
  what_to_do: "Send the request for review again when someone is available."
POLICY_CHANGE:
  title: "The company list changed"
  plain: "A person added or removed a company from the workspace list."
  why: "Keeps a record of changes that affect where emails may go."
  example: "The lead added partner-company.com to the approved list."
  what_to_do: "Check the audit log to see which company changed."
