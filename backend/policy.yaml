# AgentGate policy — evaluated by backend/gate.py (deterministic, no LLM).
# Precedence: any BLOCK rule => BLOCK; else any REVIEW rule => REVIEW; else ALLOW.
# Default deny: unknown task or tool => BLOCK. A task with no recipients/files
# section allows no recipients/files at all.

tasks:
  summarise_resume:
    allowed_tools: [summarise]

  email_company:
    allowed_tools: [send_email, read_file]
    recipients:
      allow_domains: [college.edu, partner-company.com]
      review_domains: [gmail.com]          # valid but risky -> REVIEW
    files:
      scope: ["sandbox/resumes/*"]

  placement_report:                        # staff task that may READ confidential files
    allowed_tools: [read_file, send_email]
    recipients:
      allow_domains: [college.edu, partner-company.com]
    files:
      scope: ["sandbox/resumes/*", "sandbox/placement_list.xlsx", "sandbox/payroll.csv"]

global:
  deny_tools: [delete_file]                # R8: denied for every task
  sensitive_files:                         # R4: may never be attached or deleted, any task
    - "sandbox/placement_list.xlsx"
    - "sandbox/salary*"
    - "*payroll*"
  data_labels:                             # R9: what content counts as once it has been read
    confidential: ["sandbox/placement_list.xlsx", "sandbox/salary*", "*payroll*"]
    personal: ["sandbox/resumes/*"]
  sensitive_patterns:                      # R5/R10: private data that must not leave (also when encoded)
    phone: '(?<!\d)(?:\+?91[\s-]?)?[6-9]\d{4}[\s-]?\d{5}(?!\d)'
    id_number: '(?<!\d)\d{4}[\s-]?\d{4}[\s-]?\d{4}(?!\d)'
    email_list: '(?:[\w.+-]+@[\w-]+\.[\w.]+[\s,;]+){2,}[\w.+-]+@[\w-]+\.[\w.]+'
  max_calls_per_run: 3                     # R7: egress budget per run
