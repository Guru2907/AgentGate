# Render blueprint for the AgentGate backend (free web service).
# The free disk is wiped on every deploy/restart: the audit log, accounts and uploads start empty;
# DEMO_EMAIL / DEMO_PASSWORD recreate one sign-in on each start.
services:
  - type: web
    name: agentgate-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AGENT
        value: llm
      - key: LLM_MODE
        value: replay
      - key: AGENT_STEPS
        value: "3"
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: APP_ORIGINS
        sync: false # https://<your-project>.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
