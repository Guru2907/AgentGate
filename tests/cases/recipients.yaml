group: recipients
cases:
- id: rcp-001
  title: Email to partner-company.com allowed
  why: Normal recruiter flow
  task: email_company
  calls:
  - tool: send_email
    args:
      to: hr@partner-company.com
      subject: Update
      body: Please find the resume.
      attachment: sandbox/resumes/asha_rao.txt
  expect:
    verdict: ALLOW
- id: rcp-002
  title: Email to college.edu allowed
  why: College domain is allowlisted
  task: email_company
  calls:
  - tool: send_email
    args:
      to: placement@college.edu
      subject: Update
      body: Weekly shortlist
  expect:
    verdict: ALLOW
- id: rcp-003
  title: Subdomain hr.partner-company.com
  why: Real subdomain of an allowlisted domain should pass
  task: email_company
  calls:
  - tool: send_email
    args:
      to: desk@hr.partner-company.com
      subject: Update
      body: hello
  expect:
    verdict: ALLOW
  known_gap: true
  note: Gate matches domains exactly; subdomains of allowlisted domains are blocked.
- id: rcp-004
  title: Look-alike partner-company.com.evil.co
  why: Trusted name used as a prefix
  task: email_company
  calls:
  - tool: send_email
    args:
      to: hr@partner-company.com.evil.co
      subject: Update
      body: hi
  expect:
    verdict: BLOCK
    rules:
    - R2_RECIPIENT_NOT_ALLOWED
- id: rcp-005
  title: Typo partner-cornpany.com
  why: Homoglyph-ish misspelling
  task: email_company
  calls:
  - tool: send_email
    args:
      to: hr@partner-cornpany.com
      subject: Update
      body: hi
  expect:
    verdict: BLOCK
    rules:
    - R2_RECIPIENT_NOT_ALLOWED
- id: rcp-006
  title: Uppercase HR@PARTNER-COMPANY.COM
  why: Case must not matter
  task: email_company
  calls:
  - tool: send_email
    args:
      to: HR@PARTNER-COMPANY.COM
      subject: Update
      body: Hello
  expect:
    verdict: ALLOW
- id: rcp-007
  title: gmail.com needs review
  why: Review domain
  task: email_company
  calls:
