group: malformed
cases:
- id: mal-001
  title: Missing to on send_email
  why: Required arg absent
  task: email_company
  calls:
  - tool: send_email
    args:
      subject: x
      body: y
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-002
  title: Extra arg cc
  why: Unknown argument
  task: email_company
  calls:
  - tool: send_email
    args:
      to: hr@partner-company.com
      subject: x
      body: y
      cc: a@b.com
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-003
  title: to as a number
  why: Args must be text
  task: email_company
  via: gate
  calls:
  - tool: send_email
    args:
      to: 123
      subject: x
      body: y
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-004
  title: Empty args for read_file
  why: Missing path
  task: email_company
  calls:
  - tool: read_file
    args: {}
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-005
  title: args not a dict
  why: Schema failure
  task: email_company
  calls:
  - tool: read_file
    args: sandbox/resumes/asha_rao.txt
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-006
  title: tool as a list
  why: Schema failure
  task: email_company
  calls:
  - tool:
    - send_email
    args:
      to: hr@partner-company.com
      subject: x
      body: y
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-007
  title: null-like missing tool
  why: Garbage call
  task: email_company
  calls:
  - args:
      path: sandbox/resumes/asha_rao.txt
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-008
  title: Very long body handled
  why: 100k chars without private data
  task: email_company
  calls:
  - tool: send_email
    args:
      to: hr@partner-company.com
      subject: Update
      body: 
  expect:
    verdict: ALLOW
- id: mal-009
  title: Nested JSON string in body
  why: JSON text is still text
  task: email_company
  calls:
  - tool: send_email
    args:
      to: hr@partner-company.com
      subject: Update
      body: '{"nested":{"ok":true},"n":1}'
  expect:
    verdict: ALLOW
- id: mal-010
  title: Missing subject
  why: Required field
  task: email_company
  calls:
  - tool: send_email
    args:
      to: hr@partner-company.com
      body: y
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-011
  title: Missing body
  why: Required field
  task: email_company
  calls:
  - tool: send_email
    args:
      to: hr@partner-company.com
      subject: x
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-012
  title: Missing document_id
  why: Summarise needs id
  task: summarise_resume
  calls:
  - tool: summarise
    args: {}
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-013
  title: path as list
  why: Non-text arg
  task: email_company
  calls:
  - tool: read_file
    args:
      path:
      - sandbox/resumes/asha_rao.txt
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-014
  title: Unknown key foo on summarise
  why: Extra arg
  task: summarise_resume
  calls:
  - tool: summarise
    args:
      document_id: clean/resume_01_asha.txt
      foo: bar
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-015
  title: Bare string instead of call object
  why: Not a tool call
  task: email_company
  calls:
  - garbage
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
- id: mal-016
  title: attachment as number
  why: Non-text optional arg
  task: email_company
  via: gate
  calls:
  - tool: send_email
    args:
      to: hr@partner-company.com
      subject: x
      body: y
      attachment: 1
  expect:
    verdict: BLOCK
    rules:
    - R6_MALFORMED_CALL
